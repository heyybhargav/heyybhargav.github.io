name: Deploy

# A push, or the button.
#
# There is no schedule on purpose. GitHub Pages serves files, so the writing page only
# picks up a new Substack post when something rebuilds the site, and a cron running
# every day to catch a post every couple of months is thirty wasted runs per essay.
# After publishing, hit Run workflow on the Actions tab and the new post is live in
# about a minute.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-uploaded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild refreshes data/essays.json from the Substack feed. It is written not to
      # fail the build if the feed is unreachable: the committed list is the fallback,
      # which is what makes it safe to run on every push.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
